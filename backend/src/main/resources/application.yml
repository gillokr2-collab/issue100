spring:
  application:
    name: issue100-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issue100}
    username: ${DB_USERNAME:issue100}
    password: ${DB_PASSWORD:issue100}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
  timezone: Asia/Seoul
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
community:
  rss:
    urls: ${COMMUNITY_RSS_URLS:?????Reddit Korea|https://www.reddit.com/r/korea/.rss;?????Reddit K-pop|https://www.reddit.com/r/kpop/.rss;?????Hacker News|https://news.ycombinator.com/rss}
news:
  rss:
    urls: ${NEWS_RSS_URLS:KBS|https://world.kbs.co.kr/rss/rss_news.htm?lang=k;KBS|https://world.kbs.co.kr/rss/rss_enternews.htm?lang=k;SBS|https://news.sbs.co.kr/news/newsflashRssFeed.do?plink=RSSREADER}
youtube:
  api-key: ${YOUTUBE_API_KEY:}
  region: ${YOUTUBE_REGION:KR}
