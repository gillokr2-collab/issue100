services:
  - type: web
    name: issue100-api
    runtime: docker
    plan: free
    dockerfilePath: ./infrastructure/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
